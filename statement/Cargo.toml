[package]
name = "r2c2_statement"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
readme.workspace = true
license-file.workspace = true
keywords.workspace = true

[dependencies]
# the optional dependencies below are only used by the poc_impl feature (see below)
langtag = { version = "0.4.0", optional = true }
oxrdf = { version = "0.2.4", optional = true, features = ["rdf-star"] }
rdf-types = { version = "0.22.5", optional = true }

[lints]
workspace = true

[features]
# this feature is not meant to be used in production code;
# it simply provide *example implementations* of R2C2 traits by 3rd-party RDF crates
poc_impl = ["dep:langtag", "dep:oxrdf", "dep:rdf-types"]
